<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferência de Idioma com Cookies</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        select, button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
        }

        #mensagem {
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>


    <body>

<div class="container">

    <h1 id="titulo">Bem-vindo</h1>

    <h3 id="subtitulo">Escolha seu idioma</h3>

    <p id="frase">Este é um site de exemplo.</p>

    <select id="idioma">
        <option value="pt">Português</option>
        <option value="en">English</option>
    </select>

    <button onclick="salvarIdioma()">Salvar preferência</button>
    <button onclick="removerIdioma()">Remover preferência</button>

    <div id="mensagem"></div>

</div>


</body>
</html>
