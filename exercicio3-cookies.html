<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferência de Idioma com Cookies</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        select, button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
        }

        #mensagem {
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>


    <body>

<div class="container">

    <h1 id="titulo">Bem-vindo</h1>

    <h3 id="subtitulo">Escolha seu idioma</h3>

    <p id="frase">Este é um site de exemplo.</p>

    <select id="idioma">
        <option value="pt">Português</option>
        <option value="en">English</option>
    </select>

    <button onclick="salvarIdioma()">Salvar preferência</button>
    <button onclick="removerIdioma()">Remover preferência</button>

    <div id="mensagem"></div>

</div>

<script>

    const textos = {
        pt: {
            titulo: "Bem-vindo",
            subtitulo: "Escolha seu idioma",
            frase: "Este é um site de exemplo."
        },
        en: {
            titulo: "Welcome",
            subtitulo: "Choose your language",
            frase: "This is a sample website."
        }
    };

    function aplicarIdioma(idioma) {
        document.getElementById("titulo").textContent = textos[idioma].titulo;
        document.getElementById("subtitulo").textContent = textos[idioma].subtitulo;
        document.getElementById("frase").textContent = textos[idioma].frase;

        document.getElementById("idioma").value = idioma;
    }

    function setCookie(nome, valor, dias) {
        const data = new Date();
        data.setTime(data.getTime() + (dias * 24 * 60 * 60 * 1000));

        document.cookie =
            `${nome}=${valor}; max-age=${1209600}; path=/`;
    }

    function getCookie(nome) {
        const cookies = document.cookie.split("; ");

        for (let c of cookies) {
            const [chave, valor] = c.split("=");
            if (chave === nome) {
                return valor;
            }
        }
        return null;
    }

    function deleteCookie(nome) {
        document.cookie = `${nome}=; max-age=0; path=/`;
    }

    function salvarIdioma() {
        const idioma = document.getElementById("idioma").value;

        setCookie("idioma", idioma, 14);
        aplicarIdioma(idioma);

        document.getElementById("mensagem").textContent =
            "Preferência salva!";
    }

    function removerIdioma() {
        deleteCookie("idioma");

        aplicarIdioma("pt");

        document.getElementById("mensagem").textContent =
            "Preferência removida!";
    }

    function iniciar() {
        const idiomaSalvo = getCookie("idioma");

        if (idiomaSalvo) {
            aplicarIdioma(idiomaSalvo);
        } else {
            aplicarIdioma("pt");
        }
    }

    iniciar();

</script>

</body>
</html>
