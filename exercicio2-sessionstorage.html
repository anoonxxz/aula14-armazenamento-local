<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras da Sessão (Roupas)</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.container {
    background-color: white;
    max-width: 500px;
    margin: auto;
    padding: 20px;
    border-radius: 8px;
}

h1 {
    color: #333;
    text-align: center;
}

.subtitulo {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

.botoes {
    margin-bottom: 10px;
}

button {
    padding: 10px;
    border: none;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border-radius: 4px;
}

button:hover {
    background-color: #0056b3;
}

.perigo {
    background-color: red;
}

.perigo:hover {
    background-color: darkred;
}

#mensagem {
    margin-top: 15px;
    font-weight: bold;
    color: green;
}
    </style>
    
</head>

<body>

    <div class="container">
        <h1>Roupas</h1>

        <p class="subtitulo">
            Digite o nome do produto que deseja pesquisar na nosa loja!
        </p>

    <input type="text" id="pesquisa" name="pesquisa" placeholder="Digite aqui...">

    <div class="botoes">
        <button type="button" id="btnAddCar">Adicionar ao carrinho</button>
    </div>

    <p id="contador"> 0 produto(s) no carrinho!</p>
    <ul id="listaCarrinho"></ul>

    <div class="botoes">
        <button type="button" id="btnEsvCar">Esvaziar o carrinho</button>
    </div>
    
<div id="mensagem"></div>

</div>

<script>

</script>

</body>
</html>
