<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras da Sessão</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.container {
    background-color: white;
    max-width: 500px;
    margin: auto;
    padding: 20px;
    border-radius: 8px;
}

h1 {
    color: #333;
    text-align: center;
}

.subtitulo {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

.botoes {
    margin-bottom: 10px;
}

button {
    padding: 10px;
    border: none;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border-radius: 4px;
}

button:hover {
    background-color: #0056b3;
}

.perigo {
    background-color: red;
}

.perigo:hover {
    background-color: darkred;
}

#mensagem {
    margin-top: 15px;
    font-weight: bold;
    color: green;
}
    </style>
    
</head>

<body>

    <div class="container">
        <h1>Loja</h1>

        <p class="subtitulo">
            Digite o nome do produto que deseja pesquisar na nosa loja!
        </p>

    <input type="text" id="pesquisa" name="pesquisa" placeholder="Digite aqui...">

    <div class="botoes">
        <button type="button" id="btnAddCar">Adicionar ao carrinho</button>
    </div>

    <p id="contador"> 0 produto(s) no carrinho!</p>
    <ul id="listaCarrinho"></ul>

    <div class="botoes">
        <button type="button" id="btnEsvCar">Esvaziar o carrinho</button>
    </div>

<div id="mensagem"></div>

</div>

<script>
    let produtos = [];
    
    function carregar() {
    const salvo = sessionStorage.getItem("carrinho");

    if (salvo) {
        produtos = JSON.parse(salvo);
    }

    atualizarLista();
}

    function salvar() {
    sessionStorage.setItem("carrinho", JSON.stringify(produtos));
}


    function atualizarLista() {
        const lista = document.getElementById("listaCarrinho");
        const contador = document.getElementById("contador");

        lista.innerHTML = "";

        contador.textContent = `${produtos.length} produto(s) no carrinho!`;

        produtos.forEach((produto, index) => {
            const li = document.createElement("li");
            li.textContent = produto;

        
            const btn = document.createElement("button");
            btn.textContent = "Remover";
            btn.style.marginLeft = "10px";

            btn.onclick = () => {
                produtos.splice(index, 1);
                salvar();
                atualizarLista();
        };

            li.appendChild(btn);
            lista.appendChild(li);
    });
}

document.getElementById("btnAddCar").onclick = function () {
    const input = document.getElementById("pesquisa");
    const valor = input.value.trim();

    if (valor === "") {
        document.getElementById("mensagem").textContent =
            "Digite um produto!";
        return;
    }

    produtos.push(valor);
    input.value = "";

    salvar();
    atualizarLista();

    document.getElementById("mensagem").textContent =
        "Produto adicionado!";
};

document.getElementById("btnEsvCar").onclick = function () {
    produtos = [];

    sessionStorage.removeItem("carrinho");

    atualizarLista();

    document.getElementById("mensagem").textContent =
        "Carrinho esvaziado!";
};

carregar();

</script>

</body>
</html>
